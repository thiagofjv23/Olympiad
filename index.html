<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendário</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="calendar" aria-label="Calendário mensal">
    <header class="calendar__header">
      <button id="prev" class="nav-btn" type="button" aria-label="Mês anterior">
        &#8249;
      </button>
      <h1 id="month-label" class="calendar__title" aria-live="polite"></h1>
      <button id="next" class="nav-btn" type="button" aria-label="Próximo mês">
        &#8250;
      </button>
    </header>

    <div class="calendar__weekdays">
      <span>Dom</span>
      <span>Seg</span>
      <span>Ter</span>
      <span>Qua</span>
      <span>Qui</span>
      <span>Sex</span>
      <span>Sáb</span>
    </div>

    <div id="days" class="calendar__days"></div>

    <footer class="calendar__footer">
      <button id="today" class="today-btn" type="button">Hoje</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
